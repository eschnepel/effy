name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "3 0 * * 6"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        surface:
          # Two jobs over the same "python" language so each can carry
          # its own query-filters (config-file) scoped to its own
          # paths — see the two config files for why the split exists
          # and what each covers.
          - name: main
            config-file: ./.github/codeql/codeql-config-main.yml
          - name: tests
            config-file: ./.github/codeql/codeql-config-tests.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: python
          queries: +security-and-quality
          config-file: ${{ matrix.surface.config-file }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          # Distinct per surface so the two uploads don't overwrite
          # each other in the Security tab.
          category: "/language:python-${{ matrix.surface.name }}"
